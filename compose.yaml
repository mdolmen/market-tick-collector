# A single ClickHouse node, for the Phase 4 spike and the Phase 7 sink.
#
#     docker compose up -d
#     uv run python -m bench.clickhouse kraken data/capture/kraken-p3
#     docker compose down -v      # -v: the volume holds bench data only
#
# Not a deployment. The real one is a managed service or a data-pipeline-infra
# module; this exists so the sink contract is measured against the actual
# insert path instead of an assumption about it.
services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    ports:
      - "8123:8123" # HTTP, which is what clickhouse-connect speaks
      - "9000:9000" # native, for the clickhouse-client CLI
    environment:
      CLICKHOUSE_DB: mtc
      CLICKHOUSE_USER: mtc
      CLICKHOUSE_PASSWORD: mtc
      # The bench creates and drops its own tables.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      # ClickHouse opens a file per column per part; Docker's default of 1024
      # is far below what a MergeTree wants.
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  clickhouse-data:
